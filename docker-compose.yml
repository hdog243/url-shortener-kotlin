
services:
  dynamodb-local:
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data -sharedDb"
    image: "amazon/dynamodb-local:latest"
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal

  dynamodb-admin:
      image: aaronshaf/dynamodb-admin
      container_name: dynamodb-admin
      ports:
        - "8001:8001"
      environment:
        - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      depends_on:
        - dynamodb-local
  #Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-shortener-backend
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=eu-west-2
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_TABLE=UrlMappings
    depends_on:
      - dynamodb-local

    # 3. Express GDS Frontend Container
  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: url-shortener-frontend
      ports:
        - "3000:3000"
      environment:
        - PORT=3000
        - KTOR_API_URL=http://backend:8080
      depends_on:
        - backend